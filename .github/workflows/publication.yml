name: Publication d'une version

# Lancée à la main : Actions › « Publication d'une version » › Run workflow. Construit les
# installateurs Windows et Linux, les signe pour la mise à jour en un clic, et prépare un brouillon
# de version sur GitHub (page Releases). Rien n'est proposé aux praticiens avant que ce brouillon
# soit relu puis publié.
#
# Secrets à créer une fois (Settings › Secrets and variables › Actions) : TAURI_SIGNING_PRIVATE_KEY,
# la clé privée de signature, et TAURI_SIGNING_PRIVATE_KEY_PASSWORD, son mot de passe. La clé
# publique correspondante est dans src-tauri/tauri.conf.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    name: ${{ matrix.nom }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - nom: Installateur Windows
            systeme: windows-latest
            args: --config src-tauri/tauri.publication.conf.json
          - nom: Paquet Linux
            systeme: ubuntu-24.04
            args: --bundles deb --config src-tauri/tauri.publication.conf.json
    runs-on: ${{ matrix.systeme }}
    steps:
      - name: Clé de signature présente
        shell: bash
        env:
          CLE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Ajoutez le secret TAURI_SIGNING_PRIVATE_KEY et son mot de passe TAURI_SIGNING_PRIVATE_KEY_PASSWORD (Settings › Secrets and variables › Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      # OpenSSL, compilé avec SQLCipher, a besoin de NASM sous Windows.
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Osteosphere __VERSION__
          releaseBody: |
            Windows : téléchargez le fichier se terminant par « x64-setup.exe » et ouvrez-le ; aucun droit administrateur n'est demandé.
            Linux (Ubuntu 24.04 et suivantes) : téléchargez le fichier « .deb » et ouvrez-le avec l'installateur de logiciels.
            Déjà installé : Paramètres › Version et mises à jour › Rechercher une mise à jour.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: Taille des installateurs (moins de 30 Mo)
        shell: bash
        run: sh outils/taille-installateurs.sh $(ls target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi target/release/bundle/deb/*.deb 2>/dev/null)
