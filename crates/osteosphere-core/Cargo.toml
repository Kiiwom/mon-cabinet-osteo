[package]
name = "osteosphere-core"
description = "Cœur d'Osteosphere : base chiffrée, clé de secours, numérotation des factures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
csv = "1.4"
getrandom = "0.3"
# SQLCipher et OpenSSL compilés avec le logiciel : aucune dépendance système à installer.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "~8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3"
