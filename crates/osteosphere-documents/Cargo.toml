[package]
name = "osteosphere-documents"
description = "Documents PDF d'Osteosphere (factures, comptes rendus), mis en page par Typst"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
osteosphere-core = { path = "../osteosphere-core" }
# Classeurs Excel (.xlsx) des exports : recettes, factures, statistiques, patients.
rust_xlsxwriter = "0.99"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
typst-svg = "0.15"
