[workspace]
members = ["src-tauri", "crates/osteosphere-core", "crates/osteosphere-session"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
authors = ["Pierre Besnier"]
repository = "https://github.com/Kiiwom/mon-cabinet-osteo"

# Le chiffrement reste rapide en développement (sinon Argon2 prend plusieurs secondes).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3
