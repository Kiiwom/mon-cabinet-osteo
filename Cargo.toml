[workspace]
members = ["src-tauri", "crates/osteosphere-core", "crates/osteosphere-documents", "crates/osteosphere-session", "crates/osteosphere-courriel"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
authors = ["Pierre Besnier"]
repository = "https://github.com/Kiiwom/mon-cabinet-osteo"

# Installateurs sous 30 Mo : les symboles de débogage, inutiles au praticien, ne sont pas livrés.
[profile.release]
strip = true

# Le chiffrement reste rapide en développement (sinon Argon2 prend plusieurs secondes).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3
